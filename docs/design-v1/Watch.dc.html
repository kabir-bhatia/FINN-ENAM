<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="{{theme}}">
  <div style="position: absolute; inset: 0 0 76px 0; overflow: hidden; padding: 16px 20px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="height: 44px; display: flex; align-items: center">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.18em">FINN</span>
    </div>
    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 600">Watch</h1>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink3)">PORTFOLIO · 18</span>
      <a href="AddCompany.dc.html" style="height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--oninv); border-radius: 18px; font-size: 14px; font-weight: 600; text-decoration: none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</a>
    </div>
    <div style="display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 6px 0 14px; height: 52px; border-bottom: 1px solid var(--line)">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 92px">TITAN</span><span style="flex: 1 1 auto; font-size: 14px; color: var(--ink2)">Titan Company</span>
        <button type="button" aria-label="Remove Titan Company" style="width: 44px; height: 44px; border: 0; background: none; color: var(--ink3); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 6px 0 14px; height: 52px; border-bottom: 1px solid var(--line)">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; width: 92px">RELIANCE</span><span style="flex: 1 1 auto; font-size: 14px; color: var(--ink2)">Reliance Industries</span>
        <button type="button" aria-label="Remove Reliance Industries" style="width: 44px; height: 44px; border: 0; background: none; color: var(--ink3); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 48px; color: var(--ink2); font-size: 14px">
        <span style="flex: 1 1 auto">Show all 18</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
    </div>

    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink3); margin-top: 4px">TELL ME WHEN</span>
    <div style="display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px">
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line)">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Volume above</span><span style="font-size: 12px; color: var(--ink3)">× its 20-day average</span></span>
        <button type="button" aria-label="Lower volume threshold" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--sunk); color: var(--ink); font: inherit; font-size: 18px">−</button>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; width: 44px; text-align: center">2.0×</span>
        <button type="button" aria-label="Raise volume threshold" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--sunk); color: var(--ink); font: inherit; font-size: 18px">+</button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line)">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Price moves beyond</span><span style="font-size: 12px; color: var(--ink3)">in one day, up or down</span></span>
        <button type="button" aria-label="Lower price threshold" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--sunk); color: var(--ink); font: inherit; font-size: 18px">−</button>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px; width: 44px; text-align: center">±5%</span>
        <button type="button" aria-label="Raise price threshold" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: var(--sunk); color: var(--ink); font: inherit; font-size: 18px">+</button>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line)">
        <span style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Only when no filing explains it</span><span style="font-size: 12px; color: var(--ink3)">Explained moves stay on their filing</span></span>
        <input type="checkbox" checked style="width: 22px; height: 22px; accent-color: #15171B; margin: 0">
      </label>
      <div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px">
        <span style="height: 32px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; border-radius: 16px; background: var(--actbg); color: var(--act); font-size: 13px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Governance</span>
        <span style="height: 32px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 16px; background: var(--ink); color: var(--oninv); font-size: 13px; font-weight: 500">Results</span>
        <span style="height: 32px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 16px; background: var(--ink); color: var(--oninv); font-size: 13px; font-weight: 500">M&amp;A</span>
        <span style="height: 32px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 16px; background: var(--ink); color: var(--oninv); font-size: 13px; font-weight: 500">Management</span>
        <span style="height: 32px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 16px; background: var(--sunk); color: var(--ink2); font-size: 13px; font-weight: 500">Dividend</span>
        <span style="height: 32px; padding: 0 10px; display: inline-flex; align-items: center; border-radius: 16px; background: var(--sunk); color: var(--ink2); font-size: 13px; font-weight: 500">Credit rating</span>
      </div>
    </div>

    <a href="HowFinnThinks.dc.html" style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; font-size: 15px">How FINN ranks and what it costs
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; padding-bottom: 12px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line)">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink3); text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13h4l2 3h4l2-3h4"></path><path d="M5.5 5h13l1.5 8v6H4v-6z"></path></svg>Brief</a>
    <a href="Research.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink3); text-decoration: none; font-size: 12px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5"></path></svg>Research</a>
    <a href="Watch.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink); text-decoration: none; font-size: 12px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>Watch</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var L = '--ground:#F3F3EF;--surface:#FFFFFF;--sunk:#EAEAE4;--ink:#15171B;--ink2:#4C515A;--ink3:#656A73;--line:#DEDDD6;--act:#B3261E;--actbg:#FBEAE7;--watch:#8A5300;--watchbg:#FBF0DC;--good:#1E6B3A;--goodbg:#E4F1E7;--quiet:#5B6270;--quietbg:#ECECE7;--mark:#FFE27A;--scrim:rgba(21,23,27,.45);--oninv:#F3F3EF;';
    var D = '--ground:#0F1012;--surface:#17191C;--sunk:#202328;--ink:#ECECE6;--ink2:#B4B8BF;--ink3:#8D929B;--line:#2A2D33;--act:#FF8A7A;--actbg:#3A1C19;--watch:#E8B45A;--watchbg:#33260F;--good:#74C98F;--goodbg:#14301E;--quiet:#9AA1AD;--quietbg:#24272C;--mark:#5E4B0B;--scrim:rgba(0,0,0,.6);--oninv:#0F1012;';
    var dark = this.props.dark ?? false;
    return { theme: 'width:390px;height:844px;position:relative;overflow:hidden;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;' + (dark ? D : L) };
  }
}
</script>
</body>
</html>
